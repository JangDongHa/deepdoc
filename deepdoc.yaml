version: "0.1.0"

project:
  name: modu-api-partner
  path: /Users/jangdongha/Documents/modu-api-partner
  language: typescript
  framework: nestjs

graph:
  path: .deepdoc/graph.kuzu

llm:
  provider: openai
  model: gpt-4o-mini
  embedding_provider: local
  embedding_model: jinaai/jina-embeddings-v2-base-code

scan:
  include:
    - "src/**/*.ts"
  exclude:
    - "**/*.e2e.spec.ts"
    - "**/node_modules/**"
    - "**/dist/**"

output:
  path: ./docs
  format: updoc
  language: ko
